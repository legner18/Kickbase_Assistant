<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <svg viewBox="0 0 24 24" class="brand-icon"><path d="M12 2 2 7l10 5 10-5-10-5Z" /><path d="m2 17 10 5 10-5" /><path d="m2 12 10 5 10-5" /></svg>
      <span>Kickbase Assistant</span>
    </div>

    <app-player-search />

    @if (leagueContext.leagues().length > 0) {
      <div class="league-picker">
        <label for="league-select">Liga</label>
        <select id="league-select" [value]="leagueContext.selectedLeagueId()" (change)="onLeagueChange($event)">
          @for (league of leagueContext.leagues(); track league.id) {
            <option [value]="league.id">{{ league.name }}</option>
          }
        </select>
      </div>
    }

    <nav class="nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <svg viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5" /><path d="M5 10v10h14V10" /><path d="M9 20v-6h6v6" /></svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/kader" routerLinkActive="active">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2" /><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" /><circle cx="17" cy="8.5" r="2.5" /><path d="M15.5 14.2c2.4.5 4.3 2.6 4.5 5.3" /></svg>
        <span>Kader</span>
      </a>
      <a routerLink="/verkaufs-alarm" routerLinkActive="active">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8" /><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" /></svg>
        <span>Verkaufs-Alarm</span>
      </a>
      <a routerLink="/verkaufsplaner" routerLinkActive="active">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18" /><path d="m7 15 3-4 3 2 4-6" /></svg>
        <span>Verkaufsplaner</span>
      </a>
      <a routerLink="/aufstellung" routerLinkActive="active">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" /><circle cx="12" cy="7" r="1.5" /><circle cx="7" cy="13" r="1.5" /><circle cx="17" cy="13" r="1.5" /><circle cx="12" cy="18" r="1.5" /></svg>
        <span>Aufstellung</span>
      </a>
      <a routerLink="/transfermarkt" routerLinkActive="active">
        <svg viewBox="0 0 24 24"><path d="M3 17 9 11l4 4 8-8" /><path d="M15 6h6v6" /></svg>
        <span>Transfermarkt</span>
      </a>
      <a routerLink="/liga-analyse" routerLinkActive="active">
        <svg viewBox="0 0 24 24"><path d="M4 20V10" /><path d="M12 20V4" /><path d="M20 20v-7" /></svg>
        <span>Liga-Analyse</span>
      </a>
      <a routerLink="/live" routerLinkActive="active">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5" /><path d="M8.5 8.5a5 5 0 0 0 0 7" /><path d="M15.5 15.5a5 5 0 0 0 0-7" /><path d="M5.5 5.5a9 9 0 0 0 0 13" /><path d="M18.5 18.5a9 9 0 0 0 0-13" /></svg>
        <span>Live</span>
      </a>
      <a routerLink="/preis-leistung" routerLinkActive="active">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v10" /><path d="M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1-3 2.3c0 3 6 1.4 6 4.3 0 1.4-1.3 2.4-3 2.4s-3-1-3-2.4" /></svg>
        <span>Preis-Leistung</span>
      </a>
      <a routerLink="/archiv" routerLinkActive="active">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1" /><path d="M5 9v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9" /><path d="M10 13h4" /></svg>
        <span>Archiv</span>
      </a>
    </nav>

    <button class="theme-toggle" (click)="themeService.toggle()" [title]="'Design: ' + themeLabel()">
      @switch (themeIcon()) {
        @case ('sun') {
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        }
        @case ('moon') {
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" /></svg>
        }
        @default {
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor" stroke="none" /></svg>
        }
      }
      <span>{{ themeLabel() }}</span>
    </button>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
